# Local development (the default profile)
application:
  cors:
    # typical local frontends (React/Next on 3000, Vite on 5173)
    allowed-origins: ${CORS-ALLOWED-ORIGINS:http://localhost:3000,http://localhost:5173}

spring:
  jpa:
    hibernate:
      # Flyway owns the tables (db/migration). Hibernate only checks at startup that the entities match
      # them, and fails with a clear message if you changed an entity without writing a migration.
      ddl-auto: validate
    show-sql: true
