spring:
  application:
    name: Restaurant

  # Which profile runs when none is chosen. In production start the app with
  # SPRING_PROFILES_ACTIVE=prod (see application-prod.yaml).
  profiles:
    default: dev

  # No datasource settings here on purpose: the database login does not belong in a file that is committed.
  # Spring Boot reads the standard environment variables SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and
  # SPRING_DATASOURCE_PASSWORD (see .env.example). The JDBC driver is chosen from the URL.

  # JPA / Hibernate. ddl-auto and show-sql are set per profile:
  #   application-dev.yaml  and  application-prod.yaml
  jpa:
    properties:
      hibernate:
        # when a page of orders/items is mapped, load their lazy children 50 at a time
        # instead of one query per row (the "N+1" problem)
        default_batch_fetch_size: 50

  # Redis (the cache). host and port are not set: Spring Boot's defaults are localhost:6379, which is what
  # docker compose publishes. To use another Redis set SPRING_DATA_REDIS_HOST / SPRING_DATA_REDIS_PORT.
  data:
    redis:
      timeout: 5000ms

application:
  cors:
    # comma separated list of frontend origins allowed to call the API from a browser
    allowed-origins: ${CORS-ALLOWED-ORIGINS:}
  security:
    jwt:
      secret-key: ${JWT-SECRET-KEY}
      expiration: ${JWT-EXPIRATION}
    # Optional: if both are set, an admin with this email is created (or promoted) at startup
    admin:
      email: ${ADMIN-EMAIL:}
      password: ${ADMIN-PASSWORD:}
